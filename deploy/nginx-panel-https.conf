limit_req_zone $binary_remote_addr zone=veyra_panel:1m rate=10r/s;
server {
    listen __LISTEN_ADDRESS__ ssl default_server;
    server_name __PANEL_IP__;
    ssl_certificate /etc/letsencrypt/live/veyra-panel-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veyra-panel-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:veyra_tls:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        limit_req zone=veyra_panel burst=40 nodelay;
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
