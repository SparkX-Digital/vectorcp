name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and local HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Syntax and source packaging
        if: matrix.python == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          node --check vectorcp/static/app.js
          node --check vectorcp/static/routing-form.js
          node --check vectorcp/static/data-tools.js
          node --check vectorcp/static/dns-tools.js
          node --check vectorcp/static/account-transfers.js
          node --check vectorcp/static/mail-tools.js
          node --test tests/test_site_batch.js
          bash -n deploy/install.sh
          bash -n deploy/hosting-install.sh
          bash -n deploy/dns-install.sh
          bash -n deploy/dns-public.sh
          bash -n deploy/mail-install.sh
          bash -n deploy/public-https.sh
          snapshot_archive="$RUNNER_TEMP/VectorCP-$(python -c 'from vectorcp import __version__; print(__version__)')-development-source.zip"
          python deploy/package.py --output "$snapshot_archive"
          python website/build.py --panel-source . --development-archive "$snapshot_archive" --output "$RUNNER_TEMP/website"
          python website/check.py "$RUNNER_TEMP/website"
          node --check "$RUNNER_TEMP/website/assets/site.js"
          cd "$RUNNER_TEMP"
          sha256sum --check "${snapshot_archive}.sha256"
