name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and local HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Syntax and source packaging
        if: matrix.python == '3.13'
        shell: bash
        run: |
          set -euo pipefail
          node --check veyra/static/app.js
          bash -n deploy/install.sh
          bash -n deploy/hosting-install.sh
          bash -n deploy/dns-install.sh
          bash -n deploy/public-https.sh
          python deploy/package.py --output "$RUNNER_TEMP/VectorCP-source.zip"
          cd "$RUNNER_TEMP"
          sha256sum --check VectorCP-source.zip.sha256
