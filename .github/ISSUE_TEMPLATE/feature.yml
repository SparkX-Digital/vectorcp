name: Feature proposal
description: Propose one capability with a clear user and acceptance criteria.
body:
  - type: textarea
    id: problem
    attributes:
      label: Who needs this and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Include affected roles and service dependencies.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How would we verify it is complete?
      description: Include permission boundaries and failure or recovery behavior where relevant.
    validations:
      required: true
